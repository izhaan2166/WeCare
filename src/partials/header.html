<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="logo" href="index.html" aria-label="{{name}}, home">{{> logo}}</a>
    <nav class="nav" id="site-nav" aria-label="Main">
      <ul class="nav__list">
        <li><a class="nav__link" href="index.html" {{nav:home}}>Home</a></li>
        <li><a class="nav__link" href="about.html" {{nav:about}}>About Us</a></li>
        <li><a class="nav__link" href="specialities.html" {{nav:specialities}}>Specialities</a></li>
        <li><a class="nav__link" href="doctors.html" {{nav:doctors}}>Our Doctors</a></li>
        <li><a class="nav__link" href="patient-information.html" {{nav:patients}}>Patient Information</a></li>
        <li><a class="nav__link" href="contact.html" {{nav:contact}}>Contact</a></li>
      </ul>
      <div class="nav__mobile-extra">
        <a class="btn btn--primary btn--block" href="appointment.html">Book an Appointment</a>
        <label class="lang-select lang-select--menu">{{icon:i-globe:icon icon--xs}}<span>Language</span>
          <select data-lang-select aria-label="Language">
            <option value="en" lang="en">English</option>
            <option value="hi" lang="hi">हिन्दी</option>
            <option value="kn" lang="kn">ಕನ್ನಡ</option>
          </select>
        </label>
        <p class="nav__mobile-contact">{{icon:i-phone:icon icon--xs}} {{tel:phone}}<br>{{icon:i-clock:icon icon--xs}} OPD {{hours.opd}}</p>
      </div>
    </nav>
    <div class="site-header__actions">
      <label class="lang-select lang-select--header">{{icon:i-globe:icon icon--xs}}<span class="sr-only">Language</span>
        <select data-lang-select aria-label="Language">
          <option value="en" lang="en">EN</option>
          <option value="hi" lang="hi">हिन्दी</option>
          <option value="kn" lang="kn">ಕನ್ನಡ</option>
        </select>
      </label>
      <a class="header-call" href="tel:{{phone.tel}}" aria-label="Call {{phone.display}}"><span class="header-call__icon">{{icon:i-phone:icon icon--sm}}</span><span class="header-call__num" aria-hidden="true">{{phone.display}}</span></a>
      <a class="btn btn--primary btn--header" href="appointment.html" {{nav:appointment}}>Book an Appointment</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
        <span class="sr-only" data-nav-label>Open menu</span>
        <span class="nav-toggle__bars" aria-hidden="true"><span></span><span></span></span>
      </button>
    </div>
  </div>
</header>
